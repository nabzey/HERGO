---
- name: Deploy Database Tier
  hosts: db
  become: true
  vars:
    project_path: /home/ubuntu/hergo
  tasks:
    - name: Create project directory
      file:
        path: "{{ project_path }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Template out docker-compose for DB
      template:
        src: templates/docker-compose.db.yml.j2
        dest: "{{ project_path }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Pull Database Docker images
      command: docker compose pull
      args:
        chdir: "{{ project_path }}"

    - name: Start Database container
      command: docker compose up -d
      args:
        chdir: "{{ project_path }}"

- name: Deploy Backend Tier
  hosts: back
  become: true
  vars:
    project_path: /home/ubuntu/hergo
  tasks:
    - name: Create project directory
      file:
        path: "{{ project_path }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy payment.service.js to backend host
      copy:
        src: ../../hergo-back/src/services/payment.service.js
        dest: "{{ project_path }}/payment.service.js"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Template out docker-compose for Backend
      template:
        src: templates/docker-compose.back.yml.j2
        dest: "{{ project_path }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      vars:
        db_private_ip: "{{ hostvars[groups['db'][0]].ansible_host }}"
        front_public_ip: "{{ hostvars[groups['front'][0]].ansible_host }}"

    - name: Pull Backend Docker images
      command: docker compose pull
      args:
        chdir: "{{ project_path }}"

    - name: Start Backend container (runs migrations & app)
      command: docker compose up -d
      args:
        chdir: "{{ project_path }}"

- name: Deploy Frontend Tier
  hosts: front
  become: true
  vars:
    project_path: /home/ubuntu/hergo
  tasks:
    - name: Create project directory
      file:
        path: "{{ project_path }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Template out docker-compose for Frontend
      template:
        src: templates/docker-compose.front.yml.j2
        dest: "{{ project_path }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Pull Frontend Docker images
      command: docker compose pull
      args:
        chdir: "{{ project_path }}"

    - name: Start Frontend container
      command: docker compose up -d
      args:
        chdir: "{{ project_path }}"

    - name: Update Nginx reverse proxy configuration
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/hergo
        owner: root
        group: root
        mode: '0644'
      vars:
        back_private_ip: "{{ hostvars[groups['back'][0]].ansible_host }}"

    - name: Restart Nginx to apply changes
      systemd:
        name: nginx
        state: restarted
