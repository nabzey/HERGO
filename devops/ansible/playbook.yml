---
- name: Install Docker on All Instances
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
          - git
        state: present

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Fix broken dpkg state (if any)
      command: dpkg --configure -a
      ignore_errors: yes

    - name: Purge conflicting Ubuntu docker packages
      apt:
        name:
          - docker-compose-v2
          - docker.io
          - containerd
          - runc
        state: absent
        purge: yes

    - name: Install Docker and Docker Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

- name: Setup Nginx Reverse Proxy on Front Instance
  hosts: front
  become: true
  tasks:
    - name: Install Nginx and Certbot
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Copy Nginx reverse proxy configuration template
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/hergo
        owner: root
        group: root
        mode: '0644'

    - name: Enable Nginx site for Hergo
      file:
        src: /etc/nginx/sites-available/hergo
        dest: /etc/nginx/sites-enabled/hergo
        state: link

    - name: Remove default Nginx site configuration
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart Nginx to apply changes
      systemd:
        name: nginx
        state: restarted
